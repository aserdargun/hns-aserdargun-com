      <h1>Harness Engineering Observatory</h1>
      <p>
        A bilingual, source-backed observatory comparing seven agent-system layers. Evidence and editorial
        interpretation remain separate; the observatory does not produce a universal ranking.
      </p>
      <p>
        The interactive observatory needs JavaScript. The seven agent-system layers it compares are:
      </p>
      <ul>
        <li>Execution</li>
        <li>Tools</li>
        <li>Context</li>
        <li>Lifecycle</li>
        <li>Observability</li>
        <li>Verification</li>
        <li>Governance</li>
      </ul>
      <p>
        Çalıştırma, araçlar, bağlam, yaşam döngüsü, gözlemlenebilirlik, doğrulama ve yönetişimden oluşan yedi
        ajan sistemi katmanını karşılaştıran iki dilli, kaynaklı gözlemevi. Etkileşimli gözlemevi için
        JavaScript gerekir.
      </p>
